name: Public equity market snapshot (preclose)
on:
  schedule:
    # Repeated off-hour UTC attempts span US Mountain DST and provide redundancy.
    - cron: '17 15-19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-equity-snapshot
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run public data screening
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          rm -f public/status.json
          python -m src.screen --out public || echo 'Screen returned failure; status will be audited below'
          if [ ! -f public/status.json ]; then
            python - <<'PYSTATUS'
          import json,datetime,pathlib
          pathlib.Path('public/status.json').write_text(json.dumps({'status':'FAILED','failures':['Producer exited without status.json'],'run_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PYSTATUS
          fi
      - name: Publish dated machine-readable QA status
        run: |
          git config user.name 'Equity public data bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/
          if ! git diff --cached --quiet; then
            git commit -m 'Update public market-data screen status'
            git push
          fi
      - name: Acceptance check — fail workflow on outage or deficient coverage
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open('public/status.json'))
          assert r['status']=='DATA_READY_RESEARCH_PENDING',r['failures']
          print('First-pass data coverage READY; issuer qualitative analysis remains pending')
          PY
