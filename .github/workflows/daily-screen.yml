
name: Public equity market snapshot (preclose)

on:
  schedule:
    # UTC attempts include a 10:10 AM Pacific run in PDT AND PST.
    # The 11 AM PT ChatGPT decision report uses the latest completed producer output.
    # GitHub scheduled starts may drift: acceptance requires actual data-ready time < 11 PT.
    - cron: '10 15-19 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/daily-screen.yml'
      - 'requirements.txt'
      - 'tests/**'
      - 'public/model_signal_ledger.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-equity-snapshot
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python and offline research contracts
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Run public data screening
        if: github.event_name != 'push'
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          # Fail closed: never destroy the last valid live artifact set on producer failure.
          # Generate and independently validate a complete bundle before atomic promotion.
          mkdir -p public "$RUNNER_TEMP/equity_screen"
          python -m src.screen --out "$RUNNER_TEMP/equity_screen"
          python - <<'PYSTAGE'
          import json,os
          from pathlib import Path
          from src.research_handoff import validate_research_index
          stage=Path(os.environ['RUNNER_TEMP'])/'equity_screen'
          status=json.loads((stage/'status.json').read_text())
          if status['status']!='DATA_READY_RESEARCH_PENDING':
              raise RuntimeError('NEW PRODUCER FAILED; preserving last valid published snapshot: '+str(status.get('failures')))
          latest=json.loads((stage/'latest.json').read_text())
          index=json.loads((stage/'research_metrics.json').read_text())
          if status['run_utc']!=latest['meta']['run_utc'] or status['run_utc']!=index['meta']['run_utc']:
              raise RuntimeError('Producer handoff run timestamps inconsistent; preserve previous snapshot')
          validate_research_index(index,status,lambda name:(stage/name).read_bytes())
          if not index['issuer_metrics_manifest']:
              raise RuntimeError('No research shards; preserve prior snapshot')
          print('STAGED_SNAPSHOT_VERIFIED',status['run_utc'])
          PYSTAGE
          rm -f public/status.json public/latest.json public/research_metrics*.json
          cp "$RUNNER_TEMP/equity_screen/status.json" public/status.json
          cp "$RUNNER_TEMP/equity_screen/latest.json" public/latest.json
          cp "$RUNNER_TEMP/equity_screen"/research_metrics*.json public/

      - name: Follow up prospective recommendations and calculate evidence-qualified paper results
        if: github.event_name != 'push'
        run: |
          python - <<'PYSCORE'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from src.model_performance import evaluate
          from src.model_observations import advance
          ledger_path=Path('public/model_signal_ledger.json')
          if not ledger_path.is_file():
              raise RuntimeError('Model recommendation source ledger missing')
          ledger=json.loads(ledger_path.read_text())
          audited,followup=advance(ledger,datetime.now(timezone.utc).isoformat())
          if audited['signal_events']!=ledger['signal_events'] or audited['assessment_events']!=ledger['assessment_events']:
              ledger_path.write_text(json.dumps(audited,ensure_ascii=False,indent=2)+'\n')
          scorecard=evaluate(audited)
          Path('public/model_followup_status.json').write_text(
              json.dumps(followup,ensure_ascii=False,indent=2)+'\n')
          print('Provisional assessments recorded:',followup['new_provisional_assessments'])
          print('Follow-up quote source errors:',len(followup['source_errors']))
          Path('public/model_signal_scorecard.json').write_text(
              json.dumps(scorecard,ensure_ascii=False,indent=2)+'\n')
          print('Model-only recommended ideas:',scorecard['total_recommended'])
          assert json.loads(Path('public/model_signal_scorecard.json').read_text())['total_recommended']==len(
              [e for e in audited['signal_events'] if e['event_type']=='ISSUED'])
          json.loads(Path('public/model_followup_status.json').read_text())
          print('Scorecard JSON readback VALID')
          PYSCORE

      - name: Publish dated machine-readable QA status
        if: github.event_name != 'push'
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- src/ tests/ requirements.txt .github/workflows/daily-screen.yml public/model_signal_ledger.json; then
            echo 'SOURCE_REVISION_CHANGED: refusing to publish research generated from superseded code'
            exit 1
          fi
          git config user.name 'Equity public data bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/
          if ! git diff --cached --quiet; then
            git commit -m 'Update public market-data screen status'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'push'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy screening results to GitHub Pages
        if: github.event_name != 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Acceptance check
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(Path('public/status.json').read_text())
          assert r['status']=='DATA_READY_RESEARCH_PENDING', r.get('failures')

          c=r['coverage']
          assert c['US']>=200, 'Insufficient US coverage'
          assert c['INTL']>=100, 'Insufficient international coverage'
          assert c['INTL_ETF']>=20, 'Insufficient ETF coverage'
          assert c['US_SECTORS']>=11, 'Insufficient sector coverage'

          p=Path('public/latest.json')
          assert p.exists(), 'Research queue missing'
          data=json.loads(p.read_text())
          assert len(data['us_review_queue'])>=15, 'US research queue incomplete'
          assert len(data['foreign_review_queue'])>=15, 'International research queue incomplete'

          q=Path('public/research_metrics.json')
          assert q.exists(), 'Issuer research metrics artifact missing'
          m=json.loads(q.read_text())
          assert m['meta']['run_utc']==r['run_utc'], 'Research metrics run mismatch'
          assert m['meta']['producer_source_commit']==r['producer_source_commit'], 'Producer revision mismatch'
          assert m['meta']['report_date']==r['report_date'], 'Research metrics date mismatch'
          assert m['meta']['coverage']==r['coverage'], 'Research metrics coverage mismatch'
          assert m['audit']['issuer_metrics_published']==m['issuer_metrics_total'], 'Issuer metrics count mismatch'
          from src.research_handoff import validate_research_index
          counts=validate_research_index(m,r,lambda name:(Path('public')/name).read_bytes())
          assert counts['US']==c['US'] and counts['INTL']==c['INTL'], 'Shard universe mismatch'
          assert m['audit']['us_metrics_published']>=200 and m['audit']['foreign_metrics_published']>=100
          assert m['audit']['us_preliminary_queue']>=15 and m['audit']['foreign_preliminary_queue']>=15
          assert m['provenance']['individual_row_timestamps_verified'] is False
          assert m['audit']['issuer_grade_finalists_validated']==0 and m['audit']['canonical_six_factor_scores']==0
          print('Market data READY; GitHub Pages deployed.')
          print('Issuer research and canonical scoring remain pending.')
          PY
